{% extends "layout.html" %}

{% block title %}
    User Account
{% endblock %}

{% block main %}
    <p class="lavender-text center">USER ACCOUNT</p>
    <p class="white-text center top-spacing">CHOOSE A NAME AND A PASSWORD TO SAVE YOUR HIGH SCORE</p>

    {% if get_flashed_messages() %}
        <p class="error">{{ get_flashed_messages()[0] }}</p>
    {% endif %}

    <form action="/password" method="post">
        <div class="box1 top-spacing">
            <input autocomplete="off" autofocus name="username" placeholder="NAME" type="text">
        </div>
        <div class="box1">
            <input name="password" placeholder="PASSWORD" type="password">
        </div>
        <button class="btn1" type="submit">OK</button>
    </form>
{% endblock %}
