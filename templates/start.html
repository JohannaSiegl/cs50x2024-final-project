{% extends "layout.html" %}

{% block title %}
    Start Game
{% endblock %}

{% block main %}

    <div class="top-left-right-text">
        <div class="left"><p class="lavender-text"></p></div>
        <div class="right"><p class="lavender-text" id="score">SCORE: 0</p></div>
    </div>
    <div class="fade-container">
        <p class="lavender-text center" id="level">LEVEL 1</p>
        <h2 id="random-number"></h2>
    </div>

    <table class="game-table">

        <tr id="row1">
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
                <td class="center fade-container">0</td>
        </tr>

        <tr>
            <td><button class="btn2" onclick="toggleCell(0)">2<sup>8</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(1)">2<sup>7</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(2)">2<sup>6</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(3)">2<sup>5</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(4)">2<sup>4</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(5)">2<sup>3</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(6)">2<sup>2</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(7)">2<sup>1</sup></button></td>
            <td><button class="btn2" onclick="toggleCell(8)">2<sup>0</sup></button></td>
        </tr>
        <tr>
            <td class="center">256</td>
            <td class="center">128</td>
            <td class="center">64</td>
            <td class="center">32</td>
            <td class="center">16</td>
            <td class="center">8</td>
            <td class="center">4</td>
            <td class="center">2</td>
            <td class="center">1</td>
        </tr>
    </table>

    <button class="btn1" onclick="checkAnswer()">CHECK</button>
    <script src="{{ url_for('static', filename='game.js') }}"></script>

{% endblock %}
